name: Release

# Packs the mod into an installable .zip and publishes it as a GitHub Release,
# once per push to main. Pull requests against main run the version check
# only — no pack, no publish — so a forgotten bump fails the PR instead of
# going red on main after merge.
#
# Archive layout: every mod file at the archive root, manifest.json included.
# That is one of the two shapes the game accepts on MODS > Import mod .zip
# (src/mods/LauncherMods.lua locateRoot: manifest at the root, or inside a
# single top-level folder). Nothing else is added, so the archive stays
# installable by hand too.
#
# Versioning: the release is always the version in manifest.json on the
# merged commit. Bumping that field is the only way to cut a release. If
# the number is missing, not X.Y.Z, equal to an existing vX.Y.Z tag, or
# lower than the latest one, the job fails — it never auto-bumps and never
# takes a version from a workflow_dispatch input or a commit-message tag.
# The packed archive keeps that same number, so a shipped mod never reports
# a different version than the release it came from. The version check is
# the same script on pull_request and on push; only pack and publish are
# skipped for PRs.
#
# Generated by: python3 tools/modkit.py add-release-workflow <mod-id>
# MOD_ID below is stamped to this mod's id when the file is copied.

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: ${{ github.event_name == 'pull_request' && 'read' || 'write' }}

concurrency:
  # PRs must not share the publish lock: a version check queued behind a
  # release (or cancelling one) would stall or interrupt shipping.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine version
        id: ver
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re, subprocess, sys

          SEMVER = re.compile(r"^(\d+)\.(\d+)\.(\d+)$")

          def sh(*args):
              return subprocess.run(args, capture_output=True, text=True).stdout.strip()

          def parse(text):
              m = SEMVER.match(text)
              return tuple(int(p) for p in m.groups()) if m else None

          def die(msg):
              print(f"::error::{msg}", file=sys.stderr)
              raise SystemExit(1)

          with open("manifest.json", encoding="utf-8") as fh:
              manifest_version = str(json.load(fh).get("version", ""))

          version = parse(manifest_version)
          if not version:
              die(f"manifest.json version {manifest_version!r} is not X.Y.Z")

          released = sorted(
              v for v in (parse(tag[1:]) for tag in sh("git", "tag", "-l", "v*").splitlines()) if v
          )
          latest = released[-1] if released else None
          text = "%d.%d.%d" % version

          if latest is not None and version <= latest:
              latest_text = "%d.%d.%d" % latest
              if version == latest:
                  die(f"manifest.json version {text} is already released as v{text}. "
                      "Bump version in manifest.json before merging to main.")
              die(f"manifest.json version {text} is lower than the latest release "
                  f"v{latest_text}. Bump version in manifest.json before merging to main.")

          print(f"Version {text} from manifest.json.", file=sys.stderr)
          print(f"version={text}")
          print(f"tag=v{text}")
          PY

      - name: Refuse to clobber an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists. Bump version in manifest.json."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump version in manifest.json."
            exit 1
          fi

      - name: Build the mod .zip
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          MOD_ID: "rby_mmo"
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/pkg"
          out="$GITHUB_WORKSPACE/dist"
          rm -rf "$staging" "$out"
          mkdir -p "$staging" "$out"

          git archive HEAD | tar -x -C "$staging"

          rm -rf "$staging/.github" "$staging/.gitattributes" \
                 "$staging/.gitignore" "$staging/.luarc.json"

          # Then drop whatever .modkitignore already excludes, rather than
          # keeping a second list here that can disagree with it. `modkit
          # pack` reads that file to decide what a player receives; a release
          # built from the same file hands them the same thing.
          #
          # docs/ goes too, and deliberately: it holds screenshots of a
          # running game, which are composited out of tiles, sprites and font
          # glyphs decoded from the player's own ROM. They are fine on a
          # GitHub page nobody installs; they are not something this project
          # puts inside an archive it distributes.
          python3 - "$staging" <<'PY'
          import os, shutil, sys
          staging = sys.argv[1]
          dropped = []
          with open(os.path.join(staging, ".modkitignore"), encoding="utf-8") as fh:
              entries = [ln.strip() for ln in fh
                         if ln.strip() and not ln.startswith("#")]
          for rel in entries + ["docs", ".modkitignore"]:
              target = os.path.join(staging, rel)
              if os.path.isdir(target):
                  shutil.rmtree(target); dropped.append(rel + "/")
              elif os.path.isfile(target):
                  os.remove(target); dropped.append(rel)
          print("excluded from the archive: " + ", ".join(dropped))
          PY

          # An empty tests/ or tools/ left behind by the removals above would
          # ship as a puzzling empty folder.
          find "$staging" -type d -empty -delete

          python3 - "$staging/manifest.json" "$VERSION" <<'PY'
          import json, sys
          path, version = sys.argv[1], sys.argv[2]
          with open(path, encoding="utf-8") as fh:
              manifest = json.load(fh)
          manifest["version"] = version
          with open(path, "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, indent=2, ensure_ascii=False)
              fh.write("\n")
          PY

          zip_path="$out/${MOD_ID}-${VERSION}.zip"
          (cd "$staging" && zip -qr "$zip_path" .)
          unzip -l "$zip_path"

          unzip -p "$zip_path" manifest.json > "$RUNNER_TEMP/packed-manifest.json"
          python3 - "$RUNNER_TEMP/packed-manifest.json" "$VERSION" <<'PY'
          import json, sys
          path, expected = sys.argv[1], sys.argv[2]
          with open(path, encoding="utf-8") as fh:
              version = json.load(fh)["version"]
          if version != expected:
              raise SystemExit(f"::error::packed manifest says {version}, expected {expected}")
          print(f"manifest.json is at the archive root and reports {version}")
          PY

          (cd "$out" && sha256sum "${MOD_ID}"-*.zip > sha256sums.txt)
          cat "$out/sha256sums.txt"

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          MOD_ID: "rby_mmo"
        run: |
          set -euo pipefail

          prev="$(git tag -l 'v*' --sort=-v:refname | grep -v "^${TAG}$" | head -1 || true)"
          range="${prev:+${prev}..}$GITHUB_SHA"
          changes="$(git log --no-merges --pretty='- %s' "$range" | head -50 || true)"

          notes=$'Download the .zip and install it from the game: MODS > Import mod .zip.'
          if [ -n "$changes" ]; then
            notes+=$'\n\n## Changes\n\n'"$changes"
          fi
          printf 'Release notes:\n%s\n' "$notes"

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "$notes" \
            "dist/${MOD_ID}-${VERSION}.zip" \
            "dist/sha256sums.txt"

          echo "Published release $TAG"
